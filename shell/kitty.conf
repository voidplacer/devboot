# ============================================================
# KITTY CONFIG — TMUX-LIKE BEHAVIOUR
# ============================================================

# ------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------

enable_audio_bell no
visual_bell_duration 0

font_family CaskaydiaMono Nerd Font

# Kitty provides true colour natively
term xterm-kitty

# Track current working directory
shell_integration enabled

# Mouse focus behaviour
focus_follows_mouse no

# ------------------------------------------------------------
# COLOURS — CATPPUCCIN MOCHA
# ------------------------------------------------------------

background #1e1e2e
foreground #cdd6f4

selection_background #585b70
selection_foreground #cdd6f4

cursor #f5e0dc
cursor_text_color #1e1e2e

# ------------------------------------------------------------
# TABS — TMUX STATUS BAR STYLE
# ------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style separator
tab_bar_align center

# Always display tab bar
tab_bar_min_tabs 1

# Background
tab_bar_background #1e1e2e

# Separator between tabs
tab_separator " | "

# Active tab
active_tab_foreground #1e1e2e
active_tab_background #89b4fa
active_tab_font_style bold

# Inactive tabs
inactive_tab_foreground #6c7086
inactive_tab_background #1e1e2e
inactive_tab_font_style normal

# Tab numbering starts at 1
tab_title_template " {index}:{title} "
active_tab_title_template " {index}:{title} "

# Limit tab title length
tab_title_max_length 25

# ------------------------------------------------------------
# SPLIT LAYOUT
# ------------------------------------------------------------

enabled_layouts splits

# Active/inactive pane borders
active_border_color #89b4fa
inactive_border_color #6c7086

window_border_width 1pt
draw_minimal_borders yes

# Pane padding
window_padding_width 2

# ------------------------------------------------------------
# VIM-STYLE PANE NAVIGATION
# Ctrl + h/j/k/l
# ------------------------------------------------------------

map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right

# ------------------------------------------------------------
# RESIZE PANES
# Alt + h/j/k/l
# ------------------------------------------------------------

# Kitty resizes pane dimensions rather than
# moving a specific border as tmux does.

map alt+h resize_window narrower 5
map alt+j resize_window taller 5
map alt+k resize_window shorter 5
map alt+l resize_window wider 5

# Reset pane sizes
map ctrl+shift+equal resize_window reset

# ------------------------------------------------------------
# SWITCH TABS
# Alt + 1 through 9
# ------------------------------------------------------------

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ------------------------------------------------------------
# CREATE SPLITS
# ------------------------------------------------------------

# Alt + \ = left/right split
map alt+backslash launch --location=vsplit --cwd=current

# Alt + Enter = top/bottom split
map alt+enter launch --location=hsplit --cwd=current

# ------------------------------------------------------------
# CREATE NEW TAB
# ------------------------------------------------------------

# Ctrl + t = new tab in current working directory
map ctrl+t new_tab_with_cwd

# ------------------------------------------------------------
# CLOSE TAB / PANE
# ------------------------------------------------------------

# Ctrl + w = close entire current split/pane
map ctrl+w close_window

# ------------------------------------------------------------
# RELOAD CONFIG
# ------------------------------------------------------------

# Ctrl + Shift + r = reload kitty configuration
map ctrl+shift+r load_config_file

# ------------------------------------------------------------
# ADDITIONAL TAB NAVIGATION
# ------------------------------------------------------------

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab

# ============================================================
# END OF CONFIGURATION
# ============================================================
